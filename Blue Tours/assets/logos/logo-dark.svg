<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 250" width="100%" height="100%" id="blue-tours-logo-dark">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
      
      .brand-title-dark {
        font-family: 'Playfair Display', serif;
        font-size: 52px;
        font-weight: 700;
        fill: #023E8A;
      }
      .brand-sub-dark {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 7px;
        fill: #023E8A;
      }
      .brand-tagline-dark {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 1px;
        fill: #0077B6;
      }
    </style>
  </defs>

  <!-- EMBLEM GRAPHIC (Monochrome Dark Navy/Blue Style) -->
  <g transform="translate(15, 10) scale(0.9)">
    <circle cx="125" cy="125" r="115" fill="none" stroke="#023E8A" stroke-width="1.5" />
    <circle cx="125" cy="125" r="110" fill="none" stroke="#0077B6" stroke-width="3" />
    
    <!-- Compass Points -->
    <polygon points="125,5 127,13 123,13" fill="#023E8A" />
    <text x="125" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="900" fill="#023E8A" text-anchor="middle">N</text>
    <polygon points="125,245 127,237 123,237" fill="#023E8A" />
    <polygon points="245,125 237,127 237,123" fill="#023E8A" />
    <polygon points="5,125 13,127 13,123" fill="#023E8A" />

    <g>
      <clipPath id="logo-emblem-clip-dark">
        <circle cx="125" cy="125" r="108" />
      </clipPath>
      <g clip-path="url(#logo-emblem-clip-dark)">
        <!-- Mountains -->
        <polygon points="50,170 105,90 150,170" fill="#023E8A" opacity="0.6" />
        <polygon points="100,170 155,75 210,170" fill="#023E8A" />
        <polygon points="105,90 98,101 112,101" fill="#FFFFFF" opacity="0.4" />
        <polygon points="155,75 146,88 164,88" fill="#FFFFFF" opacity="0.4" />

        <!-- Jeep Silhouette -->
        <g transform="translate(145, 137) scale(0.32)" fill="#0077B6">
          <path d="M10,40 L65,40 L65,30 L55,27 L50,15 L22,15 L20,30 L10,32 Z" />
          <path d="M24,14 L38,2 L40,2 L26,14 Z" fill="#023E8A" />
          <path d="M25,14 L52,14 L55,27 L53,28 L50,16 L24,16 Z" />
          <circle cx="22" cy="40" r="9" fill="#0077B6" stroke="#FFFFFF" stroke-width="2" />
          <circle cx="53" cy="40" r="9" fill="#0077B6" stroke="#FFFFFF" stroke-width="2" />
        </g>

        <!-- Travel Path -->
        <path d="M 172,150 C 220,120 190,50 125,45 C 65,40 35,110 80,165" 
              fill="none" stroke="#023E8A" stroke-width="1.5" stroke-dasharray="3,3" />

        <!-- Sun -->
        <circle cx="125" cy="115" r="38" fill="none" stroke="#023E8A" stroke-width="2" stroke-dasharray="4,2" />

        <!-- Waves -->
        <path d="M 15,170 C 50,160 90,205 135,165 C 175,130 205,175 235,155 L 235,235 L 15,235 Z" 
              fill="#023E8A" opacity="0.8" />
        <path d="M 15,185 C 55,195 95,160 135,190 C 175,220 205,180 235,195 L 235,235 L 15,235 Z" 
              fill="#0077B6" />

        <!-- Surfboard -->
        <g transform="translate(90, 162) rotate(-28) scale(0.5)">
          <path d="M-8,-45 C-8,-45 0,-70 8,-70 C8,-70 16,-45 16,10 C16,35 12,45 8,45 C4,45 0,35 0,10 Z" fill="#FFFFFF" stroke="#023E8A" stroke-width="2"/>
          <path d="M7,-70 L9,-70 L9,45 L7,45 Z" fill="#023E8A" />
        </g>

        <!-- Palm Tree -->
        <g transform="translate(0, 0) scale(0.5)">
          <path d="M 45,470 Q 75,340 120,240 Q 124,241 80,342 Q 50,471 45,470 Z" fill="#023E8A" />
          <path d="M 120,240 Q 70,220 30,240 C 60,255 100,250 120,240 Z" fill="#0077B6" />
          <path d="M 120,240 Q 100,170 85,130 C 105,160 120,200 120,240 Z" fill="#0077B6" />
          <path d="M 120,240 Q 150,170 180,150 C 160,190 140,220 120,240 Z" fill="#0077B6" />
          <path d="M 120,240 Q 180,230 215,245 C 180,260 150,255 120,240 Z" fill="#0077B6" />
        </g>
      </g>
    </g>
  </g>

  <!-- TYPOGRAPHY GROUP -->
  <g transform="translate(265, 75)">
    <text x="0" y="45" class="brand-title-dark">Blue Tours</text>
    <text x="5" y="88" class="brand-sub-dark">ARUGAMBAY</text>
    <line x1="5" y1="110" x2="520" y2="110" stroke="#023E8A" stroke-width="2" />
    <g transform="translate(5, 135)">
      <path d="M0,-8 L2,-2 L8,0 L2,2 L0,8 L-2,2 L-8,0 L-2,-2 Z" fill="#023E8A" />
      <text x="18" y="5" class="brand-tagline-dark">DISCOVER THE BEAUTY OF SRI LANKA WITH LOCAL EXPERTS</text>
    </g>
  </g>
</svg>
