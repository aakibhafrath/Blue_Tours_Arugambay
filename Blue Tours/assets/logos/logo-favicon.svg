<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" id="blue-tours-favicon">
  <!-- Navy Circle Base -->
  <circle cx="16" cy="16" r="15" fill="#023E8A" />
  <!-- Golden Border -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="#FDB813" stroke-width="1.5" />
  
  <!-- Rising Sun -->
  <circle cx="16" cy="13" r="5" fill="#FDB813" />
  
  <!-- Ocean Wave (Back) -->
  <path d="M2,20 Q10,16 18,22 T30,19 L30,30 L2,30 Z" fill="#0077B6" />
  
  <!-- Ocean Wave (Front) -->
  <path d="M2,23 Q11,20 17,25 T30,22 L30,30 L2,30 Z" fill="#00B4D8" />
  
  <!-- Surfboard Slicing Through -->
  <g transform="translate(14, 18) rotate(-30)">
    <path d="M-1.5,-6 C-1.5,-6 0,-10 1.5,-10 C1.5,-10 3,-6 3,5 C3,9 2,10 1.5,10 C1,10 0,9 0,5 Z" fill="#FFFFFF" />
    <line x1="0.75" y1="-10" x2="0.75" y2="10" stroke="#023E8A" stroke-width="0.5" />
  </g>
</svg>
