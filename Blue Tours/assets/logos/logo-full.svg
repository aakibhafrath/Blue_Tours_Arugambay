<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 250" width="100%" height="100%" id="blue-tours-logo-full">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
      
      .brand-title {
        font-family: 'Playfair Display', serif;
        font-size: 52px;
        font-weight: 700;
        fill: #023E8A;
      }
      .brand-sub {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 7px;
        fill: #0077B6;
      }
      .brand-tagline {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 1px;
        fill: #555555;
      }
    </style>
    
    <!-- Brand Color Gradients -->
    <linearGradient id="sky-sunset" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FDB813" stop-opacity="0.6"/>
    </linearGradient>
    
    <linearGradient id="sun-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FDB813"/>
    </linearGradient>

    <linearGradient id="mountain-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#023E8A"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>

    <linearGradient id="wave-back-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077B6"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>

    <linearGradient id="wave-front-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#90E0EF"/>
    </linearGradient>

    <linearGradient id="palm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3CB371"/>
      <stop offset="100%" stop-color="#2E8B57"/>
    </linearGradient>
    
    <linearGradient id="surfboard-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FDB813"/>
    </linearGradient>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#023E8A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- EMBLEM GRAPHIC (Left-Aligned, Rescaled and Translated) -->
  <g transform="translate(15, 10) scale(0.9)">
    <!-- Outer Compass Ring -->
    <circle cx="125" cy="125" r="115" fill="none" stroke="#023E8A" stroke-width="1.5" opacity="0.2" />
    <circle cx="125" cy="125" r="110" fill="none" stroke="#FDB813" stroke-width="3" filter="url(#soft-shadow)" />
    
    <!-- Compass Cardinal Ticks -->
    <polygon points="125,5 127,13 123,13" fill="#023E8A" />
    <text x="125" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="900" fill="#023E8A" text-anchor="middle">N</text>
    <polygon points="125,245 127,237 123,237" fill="#023E8A" />
    <polygon points="245,125 237,127 237,123" fill="#023E8A" />
    <polygon points="5,125 13,127 13,123" fill="#023E8A" />

    <!-- Clip Area -->
    <g>
      <clipPath id="logo-emblem-clip">
        <circle cx="125" cy="125" r="108" />
      </clipPath>
      <g clip-path="url(#logo-emblem-clip)">
        <!-- Background -->
        <rect x="15" y="15" width="220" height="220" fill="url(#sky-sunset)" />
        
        <!-- Sun -->
        <circle cx="125" cy="115" r="38" fill="url(#sun-grad)" />
        
        <!-- Mountains -->
        <polygon points="50,170 105,90 150,170" fill="url(#mountain-grad)" opacity="0.9" />
        <polygon points="100,170 155,75 210,170" fill="url(#mountain-grad)" />
        <polygon points="105,90 98,101 112,101" fill="#FFFFFF" opacity="0.6" />
        <polygon points="155,75 146,88 164,88" fill="#FFFFFF" opacity="0.7" />

        <!-- Jeep Silhouette -->
        <g transform="translate(145, 137) scale(0.32)" fill="#023E8A">
          <path d="M10,40 L65,40 L65,30 L55,27 L50,15 L22,15 L20,30 L10,32 Z" />
          <path d="M24,14 L38,2 L40,2 L26,14 Z" fill="#FDB813" />
          <path d="M25,14 L52,14 L55,27 L53,28 L50,16 L24,16 Z" />
          <circle cx="22" cy="40" r="9" fill="#023E8A" stroke="#FFFFFF" stroke-width="2" />
          <circle cx="53" cy="40" r="9" fill="#023E8A" stroke="#FFFFFF" stroke-width="2" />
        </g>

        <!-- Travel Path -->
        <path d="M 172,150 C 220,120 190,50 125,45 C 65,40 35,110 80,165" 
              fill="none" stroke="#FDB813" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.8" />

        <!-- Waves -->
        <path d="M 15,170 C 50,160 90,205 135,165 C 175,130 205,175 235,155 L 235,235 L 15,235 Z" 
              fill="url(#wave-back-grad)" opacity="0.85" />
        <path d="M 15,185 C 55,195 95,160 135,190 C 175,220 205,180 235,195 L 235,235 L 15,235 Z" 
              fill="url(#wave-front-grad)" />

        <!-- Surfboard -->
        <g transform="translate(90, 162) rotate(-28) scale(0.5)">
          <path d="M-8,-45 C-8,-45 0,-70 8,-70 C8,-70 16,-45 16,10 C16,35 12,45 8,45 C4,45 0,35 0,10 Z" fill="url(#surfboard-grad)" />
          <path d="M7,-70 L9,-70 L9,45 L7,45 Z" fill="#023E8A" />
        </g>

        <!-- Palm Tree -->
        <g transform="translate(0, 0) scale(0.5)">
          <path d="M 45,470 Q 75,340 120,240 Q 124,241 80,342 Q 50,471 45,470 Z" fill="#023E8A" />
          <path d="M 120,240 Q 70,220 30,240 C 60,255 100,250 120,240 Z" fill="url(#palm-grad)" />
          <path d="M 120,240 Q 100,170 85,130 C 105,160 120,200 120,240 Z" fill="url(#palm-grad)" />
          <path d="M 120,240 Q 150,170 180,150 C 160,190 140,220 120,240 Z" fill="url(#palm-grad)" />
          <path d="M 120,240 Q 180,230 215,245 C 180,260 150,255 120,240 Z" fill="url(#palm-grad)" />
        </g>
      </g>
    </g>
  </g>

  <!-- TYPOGRAPHY GROUP (Right-Aligned) -->
  <g transform="translate(265, 75)">
    <!-- Title: Blue Tours -->
    <text x="0" y="45" class="brand-title">Blue Tours</text>
    <!-- Subtitle: ARUGAMBAY -->
    <text x="5" y="88" class="brand-sub">ARUGAMBAY</text>
    
    <!-- Divider Line -->
    <line x1="5" y1="110" x2="520" y2="110" stroke="#00B4D8" stroke-width="2" opacity="0.8" />
    
    <!-- Tagline: Discover the Beauty of Sri Lanka with Local Experts. -->
    <g transform="translate(5, 135)">
      <!-- Golden Compass Accent Mini-Icon -->
      <path d="M0,-8 L2,-2 L8,0 L2,2 L0,8 L-2,2 L-8,0 L-2,-2 Z" fill="#FDB813" />
      <text x="18" y="5" class="brand-tagline">DISCOVER THE BEAUTY OF SRI LANKA WITH LOCAL EXPERTS</text>
    </g>
  </g>
</svg>
